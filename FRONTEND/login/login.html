<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawCare Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      @keyframes floaty { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      @keyframes drift { 0% { transform: translateX(0px); } 50% { transform: translateX(12px); } 100% { transform: translateX(0px); } }
      body { margin: 0; min-height: 100vh; background: #f7f4e8; color: #4b3428; font-family: Arial, Helvetica, sans-serif; }
      .paper { position: relative; background-image: radial-gradient(rgba(116, 126, 88, 0.08) 1px, transparent 1px); background-size: 22px 22px; }
      .floaty { animation: floaty 4s ease-in-out infinite; }
      .drift { animation: drift 8s ease-in-out infinite; }
    </style>
  </head>

  <body class="paper overflow-x-hidden">
    <!-- Back to Landing Page Link -->
    <div class="absolute left-6 top-6 z-50">
      <a href="../PAWCARE2026.html" class="flex items-center gap-2 font-bold text-[#7c8a5a] hover:text-[#5d7a49] transition">
        <span>←</span> Back to Home
      </a>
    </div>

    <!-- Decorative Decorations -->
    <div class="absolute left-0 top-0 h-44 w-44 rounded-br-[90px] bg-[#e1b453]/70 blur-[1px]"></div>
    <div class="absolute bottom-0 right-0 h-56 w-56 rounded-tl-[110px] bg-[#e1b453]/70 blur-[1px]"></div>
    <div class="absolute left-[10%] top-[16%] text-3xl opacity-30 floaty">🐾</div>
    <div class="absolute right-[12%] top-[20%] text-2xl opacity-30 drift">🐾</div>

    <main class="relative flex min-h-screen items-center justify-center px-6 py-10">
      <div class="grid w-full max-w-6xl items-center gap-10 lg:grid-cols-2">
        
        <!-- Left Section (Desktop Only) -->
        <section class="hidden lg:block">
          <div class="max-w-xl">
            <div class="inline-flex items-center gap-2 rounded-full border border-[#7c8a5a]/30 bg-white/70 px-4 py-2 text-sm font-medium shadow-sm backdrop-blur">
              <span>🐶</span> <span>Welcome back to PawCare</span> <span>🐱</span>
            </div>
            <h1 class="mt-6 text-5xl font-black leading-[0.95] tracking-tight xl:text-6xl">
              Log in to your <span class="block text-[#5d7a49]">pet care dashboard</span>
            </h1>
            <p class="mt-5 text-lg leading-8 text-[#6b5b4e]">
              Access your pets, schedules, reminders, and care resources in one calm and simple space.
            </p>
          </div>
        </section>

        <!-- Right Section: Login Card -->
        <section class="mx-auto w-full max-w-md rounded-[36px] border border-[#4b3428]/10 bg-white/85 p-8 shadow-2xl backdrop-blur md:p-10">
          <div class="text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-[#f1d6ad] text-3xl shadow-sm">🐾</div>
            <h2 class="mt-6 text-3xl font-black text-[#4b3428]">Login</h2>
            <p class="mt-2 text-[#6b5b4e]">Manage your pets today.</p>
          </div>

          <form onsubmit="handleLogin(event)" class="mt-8 space-y-4">
            <div>
              <label class="mb-2 block text-sm font-semibold">Email Address</label>
              <input id="email" type="email" placeholder="you@example.com" class="w-full rounded-2xl border border-[#4b3428]/10 bg-[#fffdf8] px-4 py-3 outline-none transition focus:border-[#5d7a49]" required />
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between">
                <label class="block text-sm font-semibold">Password</label>
                <a href="forgot-password.html" class="text-sm font-semibold text-[#5d7a49]">Forgot?</a>
              </div>
              <div class="relative">
                <input id="password" type="password" placeholder="••••••••" class="w-full rounded-2xl border border-[#4b3428]/10 bg-[#fffdf8] px-4 py-3 pr-11 outline-none transition focus:border-[#5d7a49]" required />
                <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#7c8a5a] transition hover:opacity-70">
                  <svg id="eyeIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- RESTORED: Remember Me Checkbox -->
            <div class="flex items-center gap-3 pt-1 text-sm text-[#6b5b4e]">
              <input type="checkbox" id="remember" class="h-4 w-4 rounded border-[#4b3428]/20 accent-[#5d7a49]" />
              <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="w-full rounded-2xl bg-[#5d7a49] py-4 font-bold text-white shadow-lg transition hover:-translate-y-1">
              Log In
            </button>
          </form>

          <p id="message" class="mt-4 text-center text-sm font-medium"></p>

          <div class="my-6 flex items-center gap-3 text-sm text-[#8c7d70]">
            <div class="h-px flex-1 bg-[#4b3428]/10"></div>
            <span>or</span>
            <div class="h-px flex-1 bg-[#4b3428]/10"></div>
          </div>

          <!-- Google Login Container -->
          <div class="flex flex-col items-center justify-center">
            <div id="g_id_onload"
                 data-client_id="365682408151-r7hqjksu8ta8virbf68el1j5to01il0u.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="continue_with" data-size="large" data-logo_alignment="left"></div>
          </div>

          <!-- RESTORED: Sign Up Section -->
          <div class="mt-8 text-center text-sm">
            <p class="text-[#6b5b4e]">
              Don't have an account? 
              <a href="signup.html" class="font-bold text-[#5d7a49] hover:underline">Sign up for free</a>
            </p>
          </div>
        </section>
      </div>
    </main>

    <script>
      let passwordVisible = false;

      // Standard Login Logic
      async function handleLogin(event) {
        event.preventDefault();
        const message = document.getElementById("message");
        const email = document.getElementById("email").value.trim().toLowerCase();  
        const password = document.getElementById("password").value.trim();

        try {
          const res = await fetch("http://localhost:5001/api/manage-users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (!res.ok) {
            message.textContent = data.error || "Invalid credentials.";
            message.style.color = "red";
            return;
          }

          localStorage.setItem("currentUser", JSON.stringify(data));
          message.textContent = "Login successful!";
          message.style.color = "green";

          setTimeout(() => {
            if (data.role === "admin") window.location.href = "../admin/dashboard-admin.html";
            else if (data.role === "moderator") window.location.href = "../moderator/dashboard-moderator.html";
            else window.location.href = "../user/dashboard-owner.html";
          }, 800);
        } catch (error) {
          message.textContent = "Cannot connect to server.";
          message.style.color = "red";
        }
      }

      // Password Visibility Toggle
      function togglePassword() {
        const input = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        passwordVisible = !passwordVisible;
        input.type = passwordVisible ? "text" : "password";
        eyeIcon.innerHTML = passwordVisible ? 
          `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>` :
          `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }

      // Google OAuth Response Handler
      async function handleCredentialResponse(response) {
        try {
          const res = await fetch("http://localhost:5001/api/manage-users/google-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken: response.credential })
          });

          const user = await res.json();
          if (res.ok) {
            localStorage.setItem("currentUser", JSON.stringify(user));
            if (user.role === "admin") window.location.href = "../admin/dashboard-admin.html";
            else if (user.role === "moderator") window.location.href = "../moderator/dashboard-moderator.html";
            else window.location.href = "../user/dashboard-owner.html";
          } else {
            alert("Google Login Failed.");
          }
        } catch (err) {
          alert("Backend server is not reachable.");
        }
      }
    </script>
  </body>
</html>
