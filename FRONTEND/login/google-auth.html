<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawCare Google Sign-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f4e8;
        color: #4b3428;
        font-family: Arial, Helvetica, sans-serif;
      }

      .paper {
        background-image: radial-gradient(rgba(116, 126, 88, 0.08) 1px, transparent 1px);
        background-size: 22px 22px;
      }
    </style>
  </head>

  <body class="paper flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md rounded-[36px] border border-[#4b3428]/10 bg-white/85 p-8 shadow-2xl">
      <div class="text-center">
        <div class="text-5xl">🔐</div>
        <p class="mt-3 text-sm font-semibold uppercase tracking-[0.22em] text-[#7c8a5a]">
          Google Sign-In
        </p>
        <h1 class="mt-2 text-3xl font-black">Continue with Google</h1>
        <p class="mt-3 text-[#6b5b4e]">
          Sign in securely using your Google account.
        </p>
      </div>

      <div class="mt-8 space-y-4">
        <button class="w-full flex items-center justify-center gap-3 rounded-2xl border border-[#4b3428]/10 bg-white px-5 py-3 font-semibold shadow-sm hover:-translate-y-1 transition">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" />
          Continue with Google
        </button>
      </div>

      <p class="mt-6 text-center text-sm text-[#6b5b4e]">
        <a href="login.html" class="font-semibold text-[#5d7a49]">
          Back to login
        </a>
      </p>

      <p class="mt-3 text-center text-sm text-[#6b5b4e]">
        <a href="PAWCARE2026.html" class="font-semibold text-[#5d7a49]">
          Back to landing page
        </a>
      </p>
    </div>
  </body>
</html>
