<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawCare Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes floaty { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      body { background: #f7f4e8; color: #4b3428; font-family: Arial, sans-serif; }
      .paper { position: relative; background-image: radial-gradient(rgba(116, 126, 88, 0.08) 1px, transparent 1px); background-size: 22px 22px; }
      .floaty { animation: floaty 4s ease-in-out infinite; }
    </style>
  </head>
  <body class="paper overflow-x-hidden">
    <!-- Back to Home Link -->
    <div class="absolute left-6 top-6 z-50">
      <a href="../PAWCARE2026.html" class="flex items-center gap-2 font-bold text-[#7c8a5a] hover:text-[#5d7a49] transition">
        <span>←</span> Back to Home
      </a>
    </div>

    <div class="absolute left-0 top-0 h-44 w-44 rounded-br-[90px] bg-[#e1b453]/70 blur-[1px]"></div>
    <div class="absolute bottom-0 right-0 h-56 w-56 rounded-tl-[110px] bg-[#e1b453]/70 blur-[1px]"></div>

    <main class="relative flex min-h-screen items-center justify-center px-6 py-10">
      <div class="grid w-full max-w-6xl items-center gap-10 lg:grid-cols-2">
        
        <section class="hidden lg:block">
          <div class="max-w-xl">
            <div class="inline-flex items-center gap-2 rounded-full border border-[#7c8a5a]/30 bg-white/70 px-4 py-2 text-sm font-medium shadow-sm backdrop-blur mb-6">
              <span>🔐</span>
              <span>Account Recovery</span>
            </div>
            <h1 class="text-5xl font-black leading-tight">Recover access to your <span class="text-[#5d7a49]">PawCare account</span></h1>
            <p class="mt-5 text-lg text-[#6b5b4e]">We will send a 6-digit verification code to your email. Please check your inbox (and spam folder).</p>
          </div>
        </section>

        <section class="mx-auto w-full max-w-md rounded-[36px] border border-[#4b3428]/10 bg-white/85 p-8 shadow-2xl backdrop-blur md:p-10">
          <div class="text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-[#f1d6ad] text-3xl shadow-sm">🔐</div>
            <h2 id="stepTitle" class="mt-4 text-3xl font-black">Reset Password</h2>
            <p id="instructionText" class="mt-2 text-[#6b5b4e]">Enter your email to receive a code.</p>
          </div>

          <div class="mt-8 space-y-4">
            <!-- STEP 1 -->
            <div id="step1">
              <label class="mb-2 block text-sm font-semibold">Email Address</label>
              <input id="email" type="email" placeholder="you@example.com" class="w-full rounded-2xl border border-[#4b3428]/10 bg-[#fffdf8] px-4 py-3 outline-none transition focus:border-[#5d7a49]" />
              <button onclick="handleSendCode()" class="mt-4 w-full rounded-2xl bg-[#5d7a49] py-4 font-bold text-white shadow-lg transition hover:-translate-y-1">
                Send Reset Code
              </button>
            </div>

            <!-- STEP 2 -->
            <div id="step2" class="hidden">
              <label class="mb-2 block text-sm font-semibold text-center">Verification Code</label>
              <input id="code" type="text" maxlength="6" placeholder="000000" class="w-full text-center text-3xl tracking-[8px] font-black rounded-2xl border border-[#4b3428]/10 bg-[#fffdf8] px-4 py-4 outline-none focus:border-[#5d7a49]" />
              <button onclick="handleVerifyCode()" class="mt-4 w-full rounded-2xl bg-[#5d7a49] py-4 font-bold text-white shadow-lg transition hover:-translate-y-1">
                Verify Code
              </button>
              <button onclick="location.reload()" class="mt-2 w-full text-xs text-[#7c8a5a] font-bold uppercase hover:underline text-center">Entered wrong email?</button>
            </div>

            <!-- STEP 3 -->
            <div id="step3" class="hidden">
              <label class="mb-2 block text-sm font-semibold">New Password</label>
              <input id="newPassword" type="password" placeholder="••••••••" class="w-full rounded-2xl border border-[#4b3428]/10 bg-[#fffdf8] px-4 py-3 outline-none focus:border-[#5d7a49]" />
              <button onclick="handleResetPassword()" class="mt-4 w-full rounded-2xl bg-[#5d7a49] py-4 font-bold text-white shadow-lg transition hover:-translate-y-1">
                Update Password
              </button>
            </div>
          </div>

          <p id="message" class="mt-4 text-center text-sm font-bold min-h-[20px]"></p>

          <p class="mt-6 text-center text-sm">
            <a href="login.html" class="font-semibold text-[#5d7a49] hover:underline">Back to login</a>
          </p>
        </section>
      </div>
    </main>

    <script>
      const API_BASE = "http://localhost:5001/api/manage-users/forgot-password";
      let userEmail = "";

      const message = document.getElementById('message');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const step3 = document.getElementById('step3');
      const instructionText = document.getElementById('instructionText');

      function showMessage(text, isError = true) {
        message.innerText = text;
        message.style.color = isError ? "red" : "green";
      }

      async function handleSendCode() {
        userEmail = document.getElementById('email').value.trim();
        if (!userEmail) return alert("Please enter your email");

        showMessage("Sending code...", false);

        try {
          const res = await fetch(`${API_BASE}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail })
          });
          const data = await res.json();

          if (res.ok) {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            instructionText.innerText = "Check " + userEmail + " for the code.";
            showMessage("✅ Code sent! Check your inbox.", false);
          } else {
            showMessage("❌ " + (data.error || "Failed to send email."));
          }
        } catch (err) { 
          showMessage("❌ Server unreachable. Is your backend running?"); 
        }
      }

      async function handleVerifyCode() {
        const codeValue = document.getElementById('code').value.trim();
        if (!codeValue) return alert("Please enter the code");

        try {
          const res = await fetch(`${API_BASE}/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, code: codeValue })
          });
          const data = await res.json();

          if (res.ok) {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            instructionText.innerText = "Set your new password below.";
            showMessage("✅ Identity verified!", false);
          } else {
            showMessage("❌ " + (data.error || "Invalid code."));
          }
        } catch (err) { showMessage("❌ Connection error."); }
      }

      async function handleResetPassword() {
        const newPass = document.getElementById('newPassword').value;
        if (newPass.length < 6) return alert("Password must be at least 6 characters");

        try {
          const res = await fetch(`${API_BASE}/reset`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, newPassword: newPass })
          });
          const data = await res.json();

          if (res.ok) {
            alert("Success! Password updated. Now login with your new password.");
            window.location.href = "login.html";
          } else {
            showMessage("❌ " + (data.error || "Reset failed."));
          }
        } catch (err) { showMessage("❌ Server error."); }
      }
    </script>
  </body>
</html>
