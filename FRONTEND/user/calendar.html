<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawCare Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f4e8;
      color: #4b3428;
      font-family: Arial, Helvetica, sans-serif;
    }

    .paper {
      background-image: radial-gradient(rgba(116, 126, 88, 0.08) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .calendar-day {
      min-height: 130px;
      transition: 0.2s ease;
    }

    .calendar-day:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(75, 52, 40, 0.12);
    }

    .modal-bg {
      background: rgba(0, 0, 0, 0.45);
    }

    .event-pill {
      font-size: 12px;
      line-height: 1.2;
      word-break: break-word;
    }
  </style>
</head>

<body class="paper">
  <div class="min-h-screen px-4 py-6 md:px-8 lg:px-10">
    <div class="mx-auto max-w-7xl">
      <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#7c8a5a]">PawCare</p>
          <h1 class="mt-2 text-3xl font-black md:text-5xl">Calendar & Reminders</h1>
          <p class="mt-3 max-w-2xl text-sm text-[#6b5b4e] md:text-base">
            Click any day to add an event, reminder, appointment, vaccine schedule, or note.
          </p>
        </div>

        <div class="flex flex-wrap gap-3">
          <a href="dashboard-owner.html" class="rounded-2xl border border-[#4b3428]/10 bg-white/80 px-5 py-3 font-semibold shadow-sm">
            Back to Dashboard
          </a>

          <button type="button" onclick="openQuickAddToday()" class="rounded-2xl bg-[#5d7a49] px-5 py-3 font-semibold text-white shadow-lg">
            + Add Event Today
          </button>
        </div>
      </div>

      <div class="mb-6 rounded-[28px] border border-[#4b3428]/10 bg-white/85 p-4 shadow-sm md:p-6">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#7c8a5a]">Planner</p>
            <h2 id="monthYear" class="mt-2 text-2xl font-black md:text-3xl"></h2>
          </div>

          <div class="flex flex-wrap gap-3">
            <button type="button" onclick="changeMonth(-1)" class="rounded-2xl bg-[#f1d6ad] px-4 py-2 font-semibold">
              ← Previous
            </button>
            <button type="button" onclick="goToToday()" class="rounded-2xl bg-white px-4 py-2 font-semibold shadow-sm">
              Today
            </button>
            <button type="button" onclick="changeMonth(1)" class="rounded-2xl bg-[#f1d6ad] px-4 py-2 font-semibold">
              Next →
            </button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-3 text-center text-sm font-bold uppercase tracking-wide text-[#7c8a5a]">
        <div class="rounded-2xl bg-white/70 py-3">Sun</div>
        <div class="rounded-2xl bg-white/70 py-3">Mon</div>
        <div class="rounded-2xl bg-white/70 py-3">Tue</div>
        <div class="rounded-2xl bg-white/70 py-3">Wed</div>
        <div class="rounded-2xl bg-white/70 py-3">Thu</div>
        <div class="rounded-2xl bg-white/70 py-3">Fri</div>
        <div class="rounded-2xl bg-white/70 py-3">Sat</div>
      </div>

      <div id="calendarGrid" class="mt-3 grid grid-cols-7 gap-3"></div>
    </div>
  </div>

  <div id="eventModal" class="fixed inset-0 hidden items-center justify-center modal-bg px-4" style="z-index:99999; pointer-events:auto;">
    <div class="relative w-full max-w-2xl rounded-[30px] bg-[#fffdf8] p-6 shadow-2xl md:p-8" style="z-index:100000; pointer-events:auto;">
      <div class="mb-6 flex items-start justify-between gap-4">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#7c8a5a]">Add Schedule</p>
          <h2 id="selectedDateLabel" class="mt-2 text-2xl font-black"></h2>
        </div>

        <button type="button" onclick="closeModal()" class="rounded-2xl bg-[#f1d6ad] px-4 py-2 font-semibold">
          Close
        </button>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm font-semibold">Event title</label>
          <input id="eventTitle" type="text" placeholder="e.g. Vet Checkup" class="w-full rounded-2xl border border-[#4b3428]/10 bg-white px-4 py-3 outline-none" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold">Time</label>
          <input id="eventTime" type="time" class="w-full rounded-2xl border border-[#4b3428]/10 bg-white px-4 py-3 outline-none" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold">Type</label>
          <select id="eventType" class="w-full rounded-2xl border border-[#4b3428]/10 bg-white px-4 py-3 outline-none">
            <option value="Reminder">Reminder</option>
            <option value="Appointment">Appointment</option>
            <option value="Vaccine">Vaccine</option>
            <option value="Feeding">Feeding</option>
            <option value="Grooming">Grooming</option>
            <option value="Walk">Walk</option>
            <option value="Medicine">Medicine</option>
          </select>
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold">Pet</label>
          <select id="eventPetId" class="w-full rounded-2xl border border-[#4b3428]/10 bg-white px-4 py-3 outline-none">
            <option value="">No pet selected</option>
          </select>
        </div>
      </div>

      <div class="mt-4">
        <label class="mb-2 block text-sm font-semibold">Notes</label>
        <textarea id="eventNotes" rows="4" placeholder="Add any details you want to remember..." class="w-full rounded-2xl border border-[#4b3428]/10 bg-white px-4 py-3 outline-none"></textarea>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
      <button
          id="saveEventBtn"
          type="button"
          class="rounded-2xl bg-[#5d7a49] px-5 py-3 font-semibold text-white shadow-lg"
          style="cursor:pointer; pointer-events:auto;"
        >
          Save Event
        </button>

        <button type="button" onclick="clearForm()" class="rounded-2xl bg-white px-5 py-3 font-semibold shadow-sm">
          Clear
        </button>
        <p id="saveDebugStatus" class="w-full text-sm font-semibold text-[#5d7a49]"></p>
      </div>

      <div class="mt-8">
        <h3 class="mb-3 text-xl font-black">Saved Events</h3>
        <div id="eventList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:5001";
const currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser || !currentUser._id) {
    window.location.href = "../login/login.html";
}

let currentDate = new Date();
let selectedDateKey = ""; // Format: YYYY-MM-DD
let allEvents = [];
let myPets = [];

// Helper to check if event belongs to user
function isMine(item) {
    const ownerId = item.ownerId?._id || item.ownerId;
    return ownerId === currentUser._id;
}

// Helper to format date to YYYY-MM-DD
function formatDateKey(year, month, day) {
    const mm = String(month + 1).padStart(2, "0");
    const dd = String(day).padStart(2, "0");
    return `${year}-${mm}-${dd}`;
}

// FIX: Extract date part without timezone shifting
function getDateKeyFromSchedule(schedule) {
    if (!schedule.date) return "";
    return schedule.date.split('T')[0];
}

function formatReadableDate(dateKey) {
    const [year, month, day] = dateKey.split('-').map(Number);
    const date = new Date(year, month - 1, day);
    return date.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

function getEventsByDate(dateKey) {
    return allEvents.filter(event => getDateKeyFromSchedule(event) === dateKey);
}

async function loadPets() {
    try {
        const res = await fetch(`${API_BASE}/api/pets`);
        const pets = await res.json();
        myPets = Array.isArray(pets) ? pets.filter(isMine) : [];

        const select = document.getElementById("eventPetId");
        select.innerHTML = `<option value="">No pet selected</option>`;
        myPets.forEach(pet => {
            const opt = document.createElement("option");
            opt.value = pet._id;
            opt.textContent = `${pet.name} (${pet.type})`;
            select.appendChild(opt);
        });
    } catch (error) {
        console.error("Failed to load pets:", error);
    }
}

async function loadEvents() {
    try {
        // Ensure we are only fetching events for the current user
        const res = await fetch(`${API_BASE}/api/calendar?ownerId=${currentUser._id}`);
        if (!res.ok) throw new Error("Failed to fetch");
        const events = await res.json();
        allEvents = Array.isArray(events) ? events : [];
        
        renderCalendar();
        if (selectedDateKey) renderEventList();
    } catch (error) {
        console.error("Error loading events:", error);
    }
}

function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    const monthYear = document.getElementById("monthYear");
    grid.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthYear.textContent = currentDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric"
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Fill empty start cells
    for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "rounded-[24px] bg-transparent";
        grid.appendChild(emptyCell);
    }

    // Fill days
    for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = formatDateKey(year, month, day);
        const dayEvents = getEventsByDate(dateKey);

        const today = new Date();
        const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();

        const dayCell = document.createElement("button");
        dayCell.type = "button";
        dayCell.className = `calendar-day rounded-[24px] border border-[#4b3428]/10 bg-white/85 p-3 text-left shadow-sm ${isToday ? 'ring-2 ring-[#5d7a49]' : ''}`;
        dayCell.onclick = () => openModal(dateKey);

        let pills = "";
        dayEvents.slice(0, 3).forEach(event => {
            const time = event.date.includes('T') ? event.date.split('T')[1].slice(0, 5) : "";
            pills += `
                <div class="event-pill mt-1 truncate rounded-lg bg-[#f1d6ad] px-2 py-0.5 text-[10px] font-bold text-[#4b3428]">
                    ${time ? time + ' ' : ''}${event.title}
                </div>
            `;
        });

        dayCell.innerHTML = `
            <div class="flex items-start justify-between">
                <span class="text-lg font-black">${day}</span>
                ${isToday ? '<span class="text-[10px] font-bold text-[#5d7a49]">TODAY</span>' : ''}
            </div>
            <div class="mt-1">${pills}${dayEvents.length > 3 ? '<div class="text-[10px] text-gray-500">...</div>' : ''}</div>
        `;
        grid.appendChild(dayCell);
    }
}

async function saveEvent() {
    const status = document.getElementById("saveDebugStatus");
    const title = document.getElementById("eventTitle").value.trim();
    const time = document.getElementById("eventTime").value || "00:00";
    const category = document.getElementById("eventType").value;
    const petId = document.getElementById("eventPetId").value;
    const notes = document.getElementById("eventNotes").value.trim();

    console.log("--- Save Attempt Started ---");
    console.log("URL:", `${API_BASE}/api/calendar`);
    
    if (!selectedDateKey || !title) {
        alert("Please select a date and title.");
        return;
    }

    const scheduleData = {
        ownerId: currentUser._id,
        title: title,
        category: category,
        date: `${selectedDateKey}T${time}:00`,
        notes: notes,
        status: "upcoming"
    };

    if (petId) scheduleData.petId = petId;

    try {
        status.textContent = "Saving... (Check Browser Console)";
        console.log("Sending data to backend:", scheduleData);

        const res = await fetch(`${API_BASE}/api/calendar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(scheduleData)
        });

        console.log("Response received from server. Status:", res.status);

        const data = await res.json();
        console.log("Server response data:", data);

        if (!res.ok) {
            throw new Error(data.error || "Server returned an error");
        }

        status.textContent = "Saved successfully!";
        alert("Event saved!");
        
        clearForm();
        await loadEvents(); // Refresh the calendar
        closeModal();
        
    } catch (error) {
        console.error("FULL ERROR DETAILS:", error);
        status.textContent = "Error: " + error.message;
        alert("Save failed. Check if your backend server is running.");
    }
}

// ... rest of your UI helper functions (changeMonth, openModal, clearForm, deleteEvent) stay mostly the same ...
// Just ensure deleteEvent also calls await loadEvents()

function changeMonth(step) {
    currentDate.setMonth(currentDate.getMonth() + step);
    renderCalendar();
}

function openModal(dateKey) {
    selectedDateKey = dateKey;
    document.getElementById("selectedDateLabel").textContent = formatReadableDate(dateKey);
    document.getElementById("eventModal").classList.replace("hidden", "flex");
    renderEventList();
}

function closeModal() {
    document.getElementById("eventModal").classList.replace("flex", "hidden");
}

function clearForm() {
    document.getElementById("eventTitle").value = "";
    document.getElementById("eventTime").value = "";
    document.getElementById("eventNotes").value = "";
}

async function deleteEvent(id) {
    if (!confirm("Delete this event?")) return;
    try {
        await fetch(`${API_BASE}/api/calendar/${id}`, { method: "DELETE" });
        await loadEvents();
    } catch (e) { console.error(e); }
}

document.addEventListener("DOMContentLoaded", () => {
    loadPets();
    loadEvents();
    document.getElementById("saveEventBtn").onclick = saveEvent;
});
  </script>
</body>
</html>
